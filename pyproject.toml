[project]
name = "chimera-ai"
version = "0.1.0"
description = "Orchestrates AI agents working on goals across multiple projects"
readme = "README.rst"
requires-python = ">=3.14"
dependencies = [
  "typer>=0.26.8",
  "pydantic>=2.13.4",
  "giterator>=1.1.0",
  "pyyaml>=6.0.3",
  "loguru>=0.7.3",
  "psutil>=7.1.4",
]

[project.urls]
Homepage = "https://github.com/chimera-orchestration/chimera-ai"
Repository = "https://github.com/chimera-orchestration/chimera-ai"

[project.scripts]
chimera = "chimera.__main__:main"
ch = "chimera.__main__:main"

[dependency-groups]
dev = [
  "ty>=0.0.55",
  "ruff>=0.15.20",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "testfixtures>=12.3.0",
  "sybil>=10.1.0",
]
docs = ["sphinx>=9.1.0", "furo>=2025.12.19"]

[tool.uv]
required-version = ">=0.11.28"
exclude-newer = "1 week"
# Pinned past their release so the 1-week window doesn't exclude them; drop once the
# global window ages past each release date on its own. Full UTC timestamps, never bare
# dates — a bare date resolves in the local timezone, so the lock disagrees with CI.
# giterator: remove ~2026-07-17 (1.1.0 published 2026-07-10)
# testfixtures: remove ~2026-07-15 (12.3.0 published 2026-07-08)
exclude-newer-package = { giterator = "2026-07-12T00:00:00Z", testfixtures = "2026-07-12T00:00:00Z" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chimera"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
addopts = "-v"

[tool.coverage.run]
source = ["chimera", "tests"]
