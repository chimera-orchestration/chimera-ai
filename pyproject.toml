[project]
name = "chimera-ai"
version = "0.1.0"
description = "Orchestrates AI agents working on goals across multiple projects"
readme = "README.rst"
requires-python = ">=3.14"
dependencies = [
  "typer>=0.26.3",
  "pydantic",
  "giterator @ git+https://github.com/simplistix/giterator",
  "pyyaml",
  "loguru>=0.7.3",
]

[project.urls]
Homepage = "https://github.com/chimera-orchestration/chimera-ai"
Repository = "https://github.com/chimera-orchestration/chimera-ai"

[project.scripts]
chimera = "chimera.__main__:app"
ch = "chimera.__main__:app"

[dependency-groups]
dev = ["ty", "ruff", "pytest", "pytest-cov", "testfixtures>=12.1.0", "sybil"]
docs = ["sphinx", "furo"]

[tool.uv]
exclude-newer = "1 week"
# giterator: remove ~2026-07-13 (1.0.0 committed 2026-07-06)
exclude-newer-package = { giterator = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chimera"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
addopts = "-v"

[tool.coverage.run]
source = ["chimera", "tests"]
