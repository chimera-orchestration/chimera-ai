[project]
name = "chimera-ai"
version = "0.1.0"
description = "Orchestrates AI agents working on goals across multiple projects"
readme = "README.rst"
requires-python = ">=3.14"
dependencies = [
  "typer>=0.26.8",
  "pydantic>=2.13.4",
  "giterator>=1.0.0",
  "pyyaml>=6.0.3",
  "loguru>=0.7.3",
]

[project.urls]
Homepage = "https://github.com/chimera-orchestration/chimera-ai"
Repository = "https://github.com/chimera-orchestration/chimera-ai"

[project.scripts]
chimera = "chimera.__main__:main"
ch = "chimera.__main__:main"

[dependency-groups]
dev = [
  "ty>=0.0.55",
  "ruff>=0.15.20",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "testfixtures>=12.2.0",
  "sybil>=10.1.0",
]
docs = ["sphinx>=9.1.0", "furo>=2025.12.19"]

[tool.uv]
exclude-newer = "1 week"
# giterator: remove ~2026-07-13 (1.0.0 published 2026-07-06)
exclude-newer-package = { giterator = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chimera"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
addopts = "-v"

[tool.coverage.run]
source = ["chimera", "tests"]
